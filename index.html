<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Biker · POS Taller</title>
<style>
:root{--bg:#0e0f12;--bg2:#16181d;--bg3:#1f2229;--line:#2c3039;--tx:#e8e9ec;--mut:#8b91a0;--ac:#ff6a13;--ac2:#ff8c42;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#111216,#1a1410);border-bottom:2px solid var(--ac);display:flex;align-items:center;gap:10px;padding:10px 14px}
header .logo{width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:900;color:#111;overflow:hidden}
header .logo img{width:100%;height:100%;object-fit:cover}
header h1{font-size:17px;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:800}header small{color:var(--mut);display:block;font-size:11px;letter-spacing:1px}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);padding:6px}
nav a{color:var(--mut);text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;font-weight:600}nav a.on{background:var(--ac);color:#111}
main{padding:14px;max-width:1200px;margin:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px;color:var(--ac2)}.kpi span{color:var(--mut);font-size:13px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0 0 10px;font-size:16px;color:var(--ac2)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}
button,.btn{background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#111}button.d{color:var(--bad)}button.s{padding:4px 8px;font-size:13px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:60px}label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row>.nf{flex:0 0 auto;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input{max-width:260px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;background:var(--bg3)}
.st-Recibido{color:#7fb3ff}.st-diagnóstico{color:var(--warn)}.st-reparación{color:var(--ac2)}.st-Listo{color:var(--ok)}.st-Entregado{color:var(--mut)}
.low{color:var(--bad);font-weight:700}.mut{color:var(--mut)}.r{text-align:right}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:20px 8px}
#modal .box{background:var(--bg2);border:1px solid var(--ac);border-radius:14px;padding:16px;width:100%;max-width:820px}
.tot{font-size:14px}.tot div{display:flex;justify-content:space-between}.tot .g{font-size:20px;font-weight:800;color:var(--ac2)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);color:#111;padding:10px 16px;border-radius:8px;font-weight:700;display:none;z-index:30}
.ticket{background:#fff;color:#111;font:13px/1.35 'Courier New',monospace;max-width:340px;margin:auto;padding:14px}
.ticket table td,.ticket table th{border:0;padding:2px;color:#111}.ticket hr{border:0;border-top:1px dashed #555}.ticket .c{text-align:center}.ticket img{max-width:90px;max-height:90px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}#modal{background:none;position:static}}
</style></head><body>
<header><div class="logo" id="hLogo">GB</div><div><h1 id="hName">Ghost Biker</h1><small>TALLER · MOTOS & AUTOS · POS</small></div></header>
<nav id="nav"></nav><main id="app"></main>
<div id="modal" onclick="if(event.target===this)closeM()"><div class="box" id="mbox"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),KEY='ghostbiker_pos_v1',STS=['Recibido','En diagnóstico','En reparación','Listo','Entregado'];
const fmt=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}),m=n=>fmt.format(+n||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),dstr=d=>new Date(d).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
const num=v=>parseFloat(v)||0;
let db,unlocked=false,cur=null;
function blank(){return{clients:[],vehicles:[],parts:[],orders:[],sales:[],moves:[],cash:{open:null,closes:[]},folio:{orden:0,venta:0,cot:0},
 config:{name:'Ghost Biker',address:'Av. Revolución 666, Col. Centro, CDMX',phone:'5512345678',rfc:'GBI260101AB1',logo:'',iva:true,mechanics:['Toño "El Fantasma"','Lalo','Memo'],footer:'¡Gracias por su preferencia! Rueda seguro. 🏍️',pwSalt:'',pwHash:''}}}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db){db=blank();seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
const byId=(c,id)=>db[c].find(x=>x.id===id);
function seed(){const c1={id:uid(),name:'Juan Pérez',phone:'5511112222',email:'juan@mail.com',demo:1},c2={id:uid(),name:'María López',phone:'5533334444',email:'maria@mail.com',demo:1};
 db.clients.push(c1,c2);
 const v1={id:uid(),clientId:c1.id,type:'Motocicleta',make:'Harley-Davidson',model:'Sportster 883',year:2018,plates:'M1-ABC',vin:'1HD4CR2108K000001',mileage:24500,cc:883,demo:1},
 v2={id:uid(),clientId:c2.id,type:'Auto',make:'Nissan',model:'Versa',year:2020,plates:'ABC-123-D',vin:'3N1CN7AD0LL000002',mileage:58000,cc:'',demo:1};db.vehicles.push(v1,v2);
 [['ACE-2050','Aceite 20W50 moto 1L',95,160,12,6],['FIL-ACE-HD','Filtro de aceite HD',120,220,5,3],['BUJ-NGK','Bujía NGK',45,90,2,4],['BAL-DEL','Balatas delanteras',280,480,6,2],['CAD-520','Kit cadena 520',900,1450,3,1]].forEach(a=>db.parts.push({id:uid(),sku:a[0],name:a[1],cost:a[2],price:a[3],stock:a[4],min:a[5],demo:1}));
 const p=db.parts;
 db.orders.push({id:uid(),folio:++db.folio.orden,clientId:c1.id,vehicleId:v1.id,problem:'Ruido en cadena y cambio de aceite',diagnosis:'Cadena estirada, requiere kit',labor:[{desc:'Servicio de afinación',qty:1,price:650},{desc:'Cambio de kit de arrastre',qty:1,price:500}],parts:[{partId:p[4].id,name:p[4].name,qty:1,price:p[4].price,cost:p[4].cost},{partId:p[0].id,name:p[0].name,qty:3,price:p[0].price,cost:p[0].cost}],status:'En reparación',mechanic:db.config.mechanics[0],advance:500,notes:'Cliente espera llamada',discount:0,iva:true,createdAt:new Date().toISOString(),demo:1});
 db.sales.push({id:uid(),folio:++db.folio.venta,type:'anticipo',date:new Date().toISOString(),items:[],total:500,subtotal:500,discount:0,iva:0,payments:{efectivo:500,tarjeta:0,transferencia:0},change:0,orderId:db.orders[0].id,demo:1});
 db.orders.push({id:uid(),folio:++db.folio.orden,clientId:c2.id,vehicleId:v2.id,problem:'Frenos rechinan',diagnosis:'',labor:[{desc:'Revisión de frenos',qty:1,price:350}],parts:[],status:'Recibido',mechanic:db.config.mechanics[1],advance:0,notes:'',discount:0,iva:true,createdAt:new Date().toISOString(),demo:1});
 for(let i=1;i<7;i++){const d=new Date(Date.now()-i*864e5);const qty=1+i%3;const sub=qty*p[0].price;const iva=sub*.16;
  db.sales.push({id:uid(),folio:++db.folio.venta,type:'venta',date:d.toISOString(),items:[{kind:'part',partId:p[0].id,name:p[0].name,qty,price:p[0].price,cost:p[0].cost},{kind:'labor',name:'Servicio de afinación',qty:1,price:650,cost:0}],subtotal:sub+650,discount:0,iva:(sub+650)*.16,total:(sub+650)*1.16,payments:{efectivo:(sub+650)*1.16,tarjeta:0,transferencia:0},change:0,demo:1})}
}
function clearDemo(){if(!confirm('¿Borrar todos los datos demo?'))return;['clients','vehicles','parts','orders','sales','moves'].forEach(k=>db[k]=db[k].filter(x=>!x.demo));save();toast('Datos demo borrados');render()}
// ---- calc
function calc(o){const sub=o.labor.reduce((a,l)=>a+num(l.qty)*num(l.price),0)+o.parts.reduce((a,l)=>a+num(l.qty)*num(l.price),0);const base=Math.max(0,sub-num(o.discount));const iva=o.iva?base*.16:0;return{sub,base,iva,total:base+iva}}
function paidOn(o){return db.sales.filter(s=>s.orderId===o.id).reduce((a,s)=>a+(s.type==='anticipo'?s.total:s.paid||0),0)}
function deductStock(o){if(o.stockDone)return;o.parts.forEach(l=>{const p=byId('parts',l.partId);if(p){p.stock-=num(l.qty);db.moves.push({id:uid(),date:new Date().toISOString(),partId:p.id,qty:-num(l.qty),type:'orden',note:'Orden #'+o.folio})}});o.stockDone=true}
// ---- nav
const VIEWS={dash:'Inicio',ordenes:'Órdenes',clientes:'Clientes',inventario:'Inventario',caja:'Ventas / Caja',reportes:'Reportes',config:'Configuración'};
function render(){const v=(location.hash.slice(1)||'dash');if(v!=='config')unlocked=false;
 $('#nav').innerHTML=Object.entries(VIEWS).map(([k,t])=>`<a href="#${k}" class="${k===v?'on':''}">${t}</a>`).join('');
 $('#hName').textContent=db.config.name;$('#hLogo').innerHTML=db.config.logo?`<img src="${db.config.logo}">`:'GB';
 $('#app').innerHTML=(window['v_'+v]||v_dash)()}
window.onhashchange=render;
function openM(h){$('#mbox').innerHTML=h;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none';cur=null}
// ---- dashboard
function salesIn(a,b){return db.sales.filter(s=>s.type!=='anticipo'&&s.date>=a&&s.date<b)}
function v_dash(){const t0=new Date();t0.setHours(0,0,0,0);const ts=salesIn(t0.toISOString(),'9');const tot=ts.reduce((a,s)=>a+s.total,0);
 const open=db.orders.filter(o=>o.status!=='Entregado'),low=db.parts.filter(p=>p.stock<=p.min);
 return `<div class="grid"><div class="card kpi"><span>Ventas de hoy</span><b>${m(tot)}</b><span>${ts.length} tickets</span></div>
 <div class="card kpi"><span>Órdenes abiertas</span><b>${open.length}</b><span>${STS.slice(0,4).map(s=>s+': '+open.filter(o=>o.status===s).length).join(' · ')}</span></div>
 <div class="card kpi"><span>Stock bajo</span><b class="${low.length?'low':''}">${low.length}</b><span>refacciones por surtir</span></div>
 <div class="card kpi"><span>Caja</span><b>${db.cash.open?'Abierta':'Cerrada'}</b><span>${db.cash.open?'desde '+dstr(db.cash.open.date):'Abre caja en Ventas'}</span></div></div>
 <div class="bar" style="margin-top:12px"><button class="p" onclick="editOrder()">+ Nueva orden</button><button onclick="location.hash='caja';setTimeout(newSale,50)">+ Venta mostrador</button><button onclick="editClient()">+ Cliente</button></div>
 <div class="grid"><div class="card"><h3>Órdenes abiertas</h3>${orderTable(open)}</div>
 <div class="card"><h3>Stock bajo</h3>${low.length?`<table>${low.map(p=>`<tr><td>${esc(p.name)}<br><span class="mut">${esc(p.sku)}</span></td><td class="low r">${p.stock} / mín ${p.min}</td></tr>`).join('')}</table>`:'<p class="mut">Todo en orden 👌</p>'}</div></div>`}
// ---- clients
function v_clientes(){const q=(window._qc||'').toLowerCase();const cl=db.clients.filter(c=>(c.name+c.phone+c.email+db.vehicles.filter(v=>v.clientId===c.id).map(v=>v.plates+v.make+v.model).join()).toLowerCase().includes(q));
 return `<h2>Clientes y vehículos</h2><div class="bar"><input placeholder="Buscar cliente, tel, placas…" value="${esc(window._qc||'')}" oninput="window._qc=this.value;render();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(99,99)"><button class="p" onclick="editClient()">+ Cliente</button></div>
 ${cl.map(c=>`<div class="card" style="margin-bottom:10px"><div class="row"><div><b>${esc(c.name)}</b><br><span class="mut">📞 ${esc(c.phone)} · ${esc(c.email)}</span></div><div class="nf"><button class="s" onclick="editClient('${c.id}')">Editar</button> <button class="s" onclick="editVehicle(null,'${c.id}')">+ Vehículo</button></div></div>
 <div class="tw"><table>${db.vehicles.filter(v=>v.clientId===c.id).map(v=>`<tr><td>${v.type==='Motocicleta'?'🏍️':'🚗'} <b>${esc(v.make)} ${esc(v.model)}</b> ${v.year||''}${v.cc?' · '+v.cc+'cc':''}<br><span class="mut">Placas ${esc(v.plates)} · VIN ${esc(v.vin)} · ${(+v.mileage||0).toLocaleString('es-MX')} km</span></td><td class="r"><button class="s" onclick="history_('${v.id}')">Historial</button> <button class="s" onclick="editVehicle('${v.id}')">Editar</button> <button class="s p" onclick="editOrder(null,'${c.id}','${v.id}')">Orden</button></td></tr>`).join('')}</table></div></div>`).join('')||'<p class="mut">Sin clientes</p>'}`}
function editClient(id){const c=id?byId('clients',id):{};openM(`<h3>${id?'Editar':'Nuevo'} cliente</h3><label>Nombre</label><input id="c_name" value="${esc(c.name)}"><div class="row"><div><label>Teléfono</label><input id="c_phone" value="${esc(c.phone)}"></div><div><label>Email</label><input id="c_email" value="${esc(c.email)}"></div></div><div class="bar" style="margin-top:12px"><button class="p" onclick="saveClient('${id||''}')">Guardar</button><button onclick="closeM()">Cancelar</button>${id?`<button class="d" onclick="delClient('${id}')">Eliminar</button>`:''}</div>`)}
function saveClient(id){const name=$('#c_name').value.trim();if(!name)return toast('Nombre requerido');let c=id?byId('clients',id):null;if(!c){c={id:uid()};db.clients.push(c)}Object.assign(c,{name,phone:$('#c_phone').value.trim(),email:$('#c_email').value.trim()});save();closeM();render();toast('Cliente guardado');return c}
function delClient(id){if(db.orders.some(o=>o.clientId===id))return toast('Tiene órdenes; no se puede eliminar');if(!confirm('¿Eliminar cliente?'))return;db.clients=db.clients.filter(c=>c.id!==id);db.vehicles=db.vehicles.filter(v=>v.clientId!==id);save();closeM();render()}
function editVehicle(id,cid){const v=id?byId('vehicles',id):{type:'Motocicleta',clientId:cid};openM(`<h3>${id?'Editar':'Nuevo'} vehículo</h3><div class="row"><div><label>Tipo</label><select id="v_type" onchange="document.getElementById('ccw').style.display=this.value==='Motocicleta'?'':'none'">${['Motocicleta','Auto'].map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Marca</label><input id="v_make" value="${esc(v.make)}"></div><div><label>Modelo</label><input id="v_model" value="${esc(v.model)}"></div></div>
 <div class="row"><div><label>Año</label><input id="v_year" type="number" value="${esc(v.year)}"></div><div><label>Placas</label><input id="v_plates" value="${esc(v.plates)}"></div><div id="ccw" style="${v.type==='Motocicleta'?'':'display:none'}"><label>Cilindrada (cc)</label><input id="v_cc" type="number" value="${esc(v.cc)}"></div></div>
 <div class="row"><div><label>VIN / No. serie</label><input id="v_vin" value="${esc(v.vin)}"></div><div><label>Kilometraje</label><input id="v_km" type="number" value="${esc(v.mileage)}"></div></div>
 <div class="bar" style="margin-top:12px"><button class="p" onclick="saveVehicle('${id||''}','${v.clientId}')">Guardar</button><button onclick="closeM()">Cancelar</button></div>`)}
function saveVehicle(id,cid){let v=id?byId('vehicles',id):null;if(!v){v={id:uid(),clientId:cid};db.vehicles.push(v)}const type=$('#v_type').value;Object.assign(v,{type,make:$('#v_make').value,model:$('#v_model').value,year:$('#v_year').value,plates:$('#v_plates').value.toUpperCase(),vin:$('#v_vin').value.toUpperCase(),mileage:$('#v_km').value,cc:type==='Motocicleta'?$('#v_cc').value:''});save();closeM();render();toast('Vehículo guardado')}
function history_(vid){const v=byId('vehicles',vid);const os=db.orders.filter(o=>o.vehicleId===vid).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 openM(`<h3>Historial · ${esc(v.make)} ${esc(v.model)} (${esc(v.plates)})</h3>${os.length?`<div class="tw"><table><tr><th>Folio</th><th>Fecha</th><th>Trabajo</th><th>Estado</th><th class="r">Total</th></tr>${os.map(o=>`<tr><td><a href="#" onclick="editOrder('${o.id}');return false" style="color:var(--ac2)">#${o.folio}</a></td><td>${dstr(o.createdAt)}</td><td>${esc(o.problem)}<br><span class="mut">${o.labor.map(l=>esc(l.desc)).join(', ')}</span></td><td><span class="tag st-${o.status.split(" ").pop()}">${o.status}</span></td><td class="r">${m(calc(o).total)}</td></tr>`).join('')}</table></div>`:'<p class="mut">Sin servicios registrados</p>'}<button onclick="closeM()">Cerrar</button>`)}
// ---- orders
function orderTable(os){if(!os.length)return '<p class="mut">Sin órdenes</p>';return `<div class="tw"><table><tr><th>Folio</th><th>Cliente / Vehículo</th><th>Estado</th><th class="r">Total</th></tr>${os.map(o=>{const c=byId('clients',o.clientId)||{},v=byId('vehicles',o.vehicleId)||{};return `<tr onclick="editOrder('${o.id}')" style="cursor:pointer"><td>#${o.folio}</td><td>${esc(c.name)}<br><span class="mut">${v.type==='Motocicleta'?'🏍️':'🚗'} ${esc(v.make)} ${esc(v.model)} · ${esc(v.plates)}</span></td><td><span class="tag st-${o.status.split(" ").pop()}">${o.status}</span><br><span class="mut">${esc(o.mechanic)}</span></td><td class="r">${m(calc(o).total)}${o.paid?'<br><span class="tag" style="color:var(--ok)">Pagada</span>':''}</td></tr>`}).join('')}</table></div>`}
function v_ordenes(){const f=window._fo||'';const os=db.orders.filter(o=>!f||o.status===f).sort((a,b)=>b.folio-a.folio);
 return `<h2>Órdenes de servicio</h2><div class="bar"><select style="max-width:200px" onchange="window._fo=this.value;render()"><option value="">Todos los estados</option>${STS.map(s=>`<option ${s===f?'selected':''}>${s}</option>`).join('')}</select><button class="p" onclick="editOrder()">+ Nueva orden</button></div><div class="card">${orderTable(os)}</div>`}
function editOrder(id,cid,vid){cur=id?JSON.parse(JSON.stringify(byId('orders',id))):{id:null,clientId:cid||'',vehicleId:vid||'',problem:'',diagnosis:'',labor:[],parts:[],status:'Recibido',mechanic:db.config.mechanics[0]||'',advance:0,advMethod:'efectivo',notes:'',discount:0,iva:db.config.iva};drawOrder()}
function drawOrder(){const o=cur,t=calc(o),vs=db.vehicles.filter(v=>v.clientId===o.clientId),closed=o.paid;
 openM(`<h3>${o.id?'Orden #'+o.folio:'Nueva orden de servicio'}</h3>
 <div class="row"><div><label>Cliente</label><select onchange="cur.clientId=this.value;cur.vehicleId='';drawOrder()"><option value="">— Selecciona —</option>${db.clients.map(c=>`<option value="${c.id}" ${c.id===o.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div><label>Vehículo</label><select onchange="cur.vehicleId=this.value"><option value="">— Selecciona —</option>${vs.map(v=>`<option value="${v.id}" ${v.id===o.vehicleId?'selected':''}>${v.type==='Motocicleta'?'🏍️':'🚗'} ${esc(v.make)} ${esc(v.model)} ${esc(v.plates)}</option>`).join('')}</select></div></div>
 <div class="row"><div><label>Estado</label><select onchange="cur.status=this.value">${STS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Mecánico</label><select onchange="cur.mechanic=this.value"><option value="">—</option>${db.config.mechanics.map(x=>`<option ${x===o.mechanic?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>
 <label>Descripción del problema</label><textarea onchange="cur.problem=this.value">${esc(o.problem)}</textarea><label>Diagnóstico</label><textarea onchange="cur.diagnosis=this.value">${esc(o.diagnosis)}</textarea>

  if(o.advance>0)db.sales.push({id:uid(),folio:++db.folio.venta,type:'anticipo',date:o.createdAt,items:[],subtotal:o.advance,discount:0,iva:0,total:o.advance,payments:{efectivo:0,tarjeta:0,transferencia:0,[o.advMethod||'efectivo']:o.advance},change:0,orderId:o.id})}

function editPart(id){const p=id?byId('parts',id):{stock:0,min:1};openM(`<h3>${id?'Editar':'Nueva'} refacción</h3><div class="row"><div><label>SKU</label><input id="p_sku" value="${esc(p.sku)}"></div><div><label>Nombre</label><input id="p_name" value="${esc(p.name)}"></div></div><div class="row"><div><label>Costo</label><input id="p_cost" type="number" value="${esc(p.cost)}"></div><div><label>Precio venta</label><input id="p_price" type="number" value="${esc(p.price)}"></div><div><label>Stock${id?' (usar ajuste)':' inicial'}</label><input id="p_stock" type="number" value="${p.stock}" ${id?'disabled':''}></div><div><label>Stock mínimo</label><input id="p_min" type="number" value="${p.min}"></div></div><div class="bar" style="margin-top:12px"><button class="p" onclick="savePart('${id||''}')">Guardar</button><button onclick="closeM()">Cancelar</button></div>`)}
function savePart(id){const sku=$('#p_sku').value.trim(),name=$('#p_name').value.trim();if(!sku||!name)return toast('SKU y nombre requeridos');let p=id?byId('parts',id):null;if(!p){p={id:uid(),stock:num($('#p_stock').value)};db.parts.push(p);if(p.stock)db.moves.push({id:uid(),date:new Date().toISOString(),partId:p.id,qty:p.stock,type:'entrada',note:'Stock inicial'})}Object.assign(p,{sku,name,cost:num($('#p_cost').value),price:num($('#p_price').value),min:num($('#p_min').value)});save();closeM();render();toast('Guardado')}
function movePart(id){const p=byId('parts',id);openM(`<h3>Movimiento · ${esc(p.name)} (stock ${p.stock})</h3><div class="row"><div><label>Tipo</label><select id="mv_t"><option value="entrada">Entrada (compra)</option><option value="ajuste">Ajuste (+/-)</option></select></div><div><label>Cantidad</label><input id="mv_q" type="number"></div><div><label>Costo unitario (entrada)</label><input id="mv_c" type="number" value="${p.cost}"></div></div><label>Nota</label><input id="mv_n" placeholder="Proveedor, factura, motivo…"><div class="bar" style="margin-top:12px"><button class="p" onclick="saveMove('${id}')">Aplicar</button><button onclick="closeM()">Cancelar</button></div>`)}
function saveMove(id){const p=byId('parts',id),t=$('#mv_t').value;let q=num($('#mv_q').value);if(!q)return toast('Cantidad requerida');if(t==='entrada'){q=Math.abs(q);p.cost=num($('#mv_c').value)||p.cost}p.stock+=q;db.moves.push({id:uid(),date:new Date().toISOString(),partId:id,qty:q,type:t,note:$('#mv_n').value});save();closeM();render();toast('Stock actualizado: '+p.stock)}
// ---- caja / ventas
function cashTotals(){const o=db.cash.open;if(!o)return null;const ss=db.sales.filter(s=>s.date>=o.date);const t={efectivo:0,tarjeta:0,transferencia:0};ss.forEach(s=>{for(const k in t)t[k]+=num(s.payments[k]);t.efectivo-=num(s.change)});const wd=o.withdrawals.reduce((a,w)=>a+w.amt,0);return{...t,wd,count:ss.length,expected:o.opening+t.efectivo-wd}}
function v_caja(){const o=db.cash.open,t=cashTotals();const recent=db.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
 return `<h2>Ventas / Caja</h2><div class="bar"><button class="p" onclick="newSale()">+ Venta mostrador</button>${o?`<button onclick="withdraw()">Retiro de efectivo</button><button onclick="closeCash()">✂ Corte de caja</button>`:`<button class="p" onclick="openCash()">Abrir caja</button>`}</div>
 ${o?`<div class="grid"><div class="card kpi"><span>Fondo inicial</span><b>${m(o.opening)}</b></div><div class="card kpi"><span>Efectivo</span><b>${m(t.efectivo)}</b></div><div class="card kpi"><span>Tarjeta</span><b>${m(t.tarjeta)}</b></div><div class="card kpi"><span>Transferencia</span><b>${m(t.transferencia)}</b></div><div class="card kpi"><span>Retiros</span><b>${m(t.wd)}</b></div><div class="card kpi"><span>Efectivo esperado en caja</span><b>${m(t.expected)}</b></div></div>`:'<p class="mut">La caja está cerrada. Ábrela con un fondo inicial para registrar el turno.</p>'}
 <div class="card" style="margin-top:12px"><h3>Órdenes por cobrar</h3>${orderTable(db.orders.filter(x=>!x.paid&&(x.status==='Listo'||x.status==='Entregado')))}</div>
 <div class="card" style="margin-top:12px"><h3>Movimientos recientes</h3><div class="tw"><table><tr><th>Folio</th><th>Fecha</th><th>Tipo</th><th class="r">Total</th><th></th></tr>${recent.map(s=>`<tr><td>V-${s.folio}</td><td>${dstr(s.date)}</td><td>${s.type}</td><td class="r">${m(s.type==='orden'?s.paid:s.total)}</td><td class="r"><button class="s" onclick="printDoc('venta','${s.id}')">Ticket</button></td></tr>`).join('')}</table></div></div>
 ${db.cash.closes.length?`<div class="card" style="margin-top:12px"><h3>Cortes anteriores</h3><table>${db.cash.closes.slice(-5).reverse().map(c=>`<tr><td>${dstr(c.date)}</td><td>Esperado ${m(c.expected)}</td><td>Contado ${m(c.counted)}</td><td class="${Math.abs(c.counted-c.expected)>.5?'low':''}">Dif ${m(c.counted-c.expected)}</td></tr>`).join('')}</table></div>`:''}`}
function openCash(){const v=prompt('Fondo inicial de caja ($):','500');if(v===null)return;db.cash.open={id:uid(),date:new Date().toISOString(),opening:num(v),withdrawals:[]};save();render();toast('Caja abierta')}
function withdraw(){const v=num(prompt('Monto a retirar ($):'));if(!v)return;const r=prompt('Motivo:','Pago proveedor')||'';db.cash.open.withdrawals.push({amt:v,reason:r,date:new Date().toISOString()});save();render();toast('Retiro registrado')}
function closeCash(){const t=cashTotals(),o=db.cash.open;openM(`<h3>Corte de caja</h3><div class="tot card"><div><span>Apertura</span><span>${dstr(o.date)}</span></div><div><span>Fondo inicial</span><span>${m(o.opening)}</span></div><div><span>Efectivo (neto de cambio)</span><span>${m(t.efectivo)}</span></div><div><span>Tarjeta</span><span>${m(t.tarjeta)}</span></div><div><span>Transferencia</span><span>${m(t.transferencia)}</span></div><div><span>Retiros</span><span>-${m(t.wd)}</span></div>${o.withdrawals.map(w=>`<div class="mut"><span>· ${esc(w.reason)}</span><span>${m(w.amt)}</span></div>`).join('')}<div><span>Movimientos</span><span>${t.count}</span></div><div class="g"><span>Efectivo esperado</span><span>${m(t.expected)}</span></div><div><span>Total vendido</span><span>${m(t.efectivo+t.tarjeta+t.transferencia)}</span></div></div><label>Efectivo contado</label><input id="cc_n" type="number" value="${t.expected.toFixed(2)}"><div class="bar" style="margin-top:12px"><button class="p" onclick="doClose()">Cerrar caja</button><button onclick="window.print()">Imprimir</button><button onclick="closeM()">Cancelar</button></div>`);$('#mbox').id='mbox';}
function doClose(){const t=cashTotals();db.cash.closes.push({...db.cash.open,...t,date:new Date().toISOString(),counted:num($('#cc_n').value)});db.cash.open=null;save();closeM();render();toast('Corte realizado')}
function newSale(){cur={sale:1,labor:[],parts:[],discount:0,iva:db.config.iva};drawSale()}
function drawSale(){const o=cur,t=calc(o);openM(`<h3>Venta de mostrador</h3><select onchange="if(this.value){const p=byId('parts',this.value);const ex=cur.parts.find(l=>l.partId===p.id);ex?ex.qty++:cur.parts.push({partId:p.id,name:p.name,qty:1,price:p.price,cost:p.cost});drawSale()}"><option value="">+ Agregar refacción…</option>${db.parts.map(p=>`<option value="${p.id}" ${p.stock<=0?'disabled':''}>${esc(p.sku)} · ${esc(p.name)} · ${m(p.price)} (stock ${p.stock})</option>`).join('')}</select>
 <div class="tw"><table>${o.parts.map((l,i)=>`<tr><td>${esc(l.name)}</td><td style="width:70px"><input type="number" value="${l.qty}" onchange="cur.parts[${i}].qty=num(this.value);drawSale()"></td><td class="r">${m(l.qty*l.price)}</td><td style="width:40px"><button class="s d" onclick="cur.parts.splice(${i},1);drawSale()">✕</button></td></tr>`).join('')}</table></div>
 <div class="row"><div><label>Descuento ($)</label><input type="number" value="${o.discount}" onchange="cur.discount=num(this.value);drawSale()"></div><div class="nf"><label><input type="checkbox" style="width:auto" ${o.iva?'checked':''} onchange="cur.iva=this.checked;drawSale()"> IVA 16%</label></div></div>
 <div class="tot card" style="margin-top:10px"><div><span>Subtotal</span><span>${m(t.sub)}</span></div><div><span>IVA</span><span>${m(t.iva)}</span></div><div class="g"><span>Total</span><span>${m(t.total)}</span></div></div>
 <div class="bar" style="margin-top:12px"><button class="p" ${o.parts.length?'':'disabled'} onclick="payDlg(${t.total.toFixed(2)},'venta')">Cobrar</button><button onclick="closeM()">Cancelar</button></div>`)}
function chargeOrder(id){const o=byId('orders',id);cur=JSON.parse(JSON.stringify(o));const due=calc(o).total-paidOn(o);payDlg(+due.toFixed(2),'orden',id)}
function payDlg(due,type,oid){window._pay={due,type,oid};openM(`<h3>Cobro · ${m(due)}</h3><div class="row"><div><label>Efectivo</label><input id="pe" type="number" oninput="payUpd()"></div><div><label>Tarjeta</label><input id="pt" type="number" oninput="payUpd()"></div><div><label>Transferencia</label><input id="pr" type="number" oninput="payUpd()"></div></div>
 <div class="bar" style="margin-top:8px"><button class="s" onclick="pe.value=${due};pt.value=pr.value='';payUpd()">Efectivo exacto</button><button class="s" onclick="pt.value=${due};pe.value=pr.value='';payUpd()">Tarjeta</button><button class="s" onclick="pr.value=${due};pe.value=pt.value='';payUpd()">Transferencia</button>${[200,500,1000].map(b=>`<button class="s" onclick="pe.value=${b};payUpd()">$${b}</button>`).join('')}</div>
 <div class="tot card" id="payInfo"></div><div class="bar" style="margin-top:12px"><button class="p" id="payOk" onclick="doPay()">Confirmar pago</button><button onclick="closeM()">Cancelar</button></div>`);payUpd()}
function payUpd(){const d=window._pay.due,e=num(pe.value),t=num(pt.value),r=num(pr.value),paid=e+t+r,nc=t+r;const ok=paid>=d-.005&&nc<=d+.005;const ch=Math.max(0,paid-d);
 $('#payInfo').innerHTML=`<div><span>Pagado</span><span>${m(paid)}</span></div><div><span>Falta</span><span>${m(Math.max(0,d-paid))}</span></div><div class="g"><span>Cambio</span><span>${m(ok?ch:0)}</span></div>${nc>d+.005?'<div class="low">Tarjeta/transferencia excede el total</div>':''}`;$('#payOk').disabled=!ok}
function doPay(){const{due,type,oid}=window._pay,e=num(pe.value),t=num(pt.value),r=num(pr.value),ch=+Math.max(0,e+t+r-due).toFixed(2);const o=cur,tt=calc(o);
 const items=[...o.labor.map(l=>({kind:'labor',name:l.desc,qty:l.qty,price:l.price,cost:0})),...o.parts.map(l=>({kind:'part',partId:l.partId,name:l.name,qty:l.qty,price:l.price,cost:l.cost}))];
 const s={id:uid(),folio:++db.folio.venta,type,date:new Date().toISOString(),items,subtotal:tt.sub,discount:num(o.discount),iva:tt.iva,total:tt.total,paid:due,payments:{efectivo:e,tarjeta:t,transferencia:r},change:ch,orderId:oid||null};db.sales.push(s);
 if(type==='venta')o.parts.forEach(l=>{const p=byId('parts',l.partId);p.stock-=l.qty;db.moves.push({id:uid(),date:s.date,partId:p.id,qty:-l.qty,type:'venta',note:'Venta V-'+s.folio})});
 else{const ro=byId('orders',oid);ro.paid=true;ro.saleId=s.id;if(ro.status!=='Entregado')ro.status='Entregado';deductStock(ro)}
 save();render();toast('Pago registrado'+(ch?' · Cambio '+m(ch):''));printDoc('venta',s.id)}
// ---- tickets
function docData(kind,id){const C=db.config;let o,title,folio,date,items,t,client,veh,extra='',payments=null,change=0,paid=0;
 if(kind==='venta'){const s=byId('sales',id);o=s.orderId?byId('orders',s.orderId):null;title=s.type==='anticipo'?'RECIBO DE ANTICIPO':'TICKET DE VENTA';folio='V-'+String(s.folio).padStart(5,'0');date=s.date;items=s.items;t={sub:s.subtotal,iva:s.iva,total:s.total};payments=s.payments;change=s.change;if(s.type==='anticipo')items=[{name:'Anticipo orden #'+(o&&o.folio),qty:1,price:s.total}];if(s.type==='orden')paid=s.paid}
 else{o=byId('orders',id);title=kind==='cot'?'COTIZACIÓN':'ORDEN DE SERVICIO';folio=(kind==='cot'?'C-':'OS-')+String(o.folio).padStart(5,'0');date=kind==='cot'?new Date().toISOString():o.createdAt;items=[...o.labor.map(l=>({name:l.desc,qty:l.qty,price:l.price})),...o.parts];t=calc(o)}
 if(o){client=byId('clients',o.clientId);veh=byId('vehicles',o.vehicleId)}
 return{C,o,title,folio,date,items,t,client,veh,payments,change,paid,kind,disc:o&&kind!=='venta'?o.discount:(kind==='venta'?byId('sales',id).discount:0)}}

 ${d.o&&d.kind==='orden'?`<tr><td>Pagado</td><td style="text-align:right">${m(paidOn(d.o))}</td></tr><tr><td>Saldo</td><td style="text-align:right">${m(d.t.total-paidOn(d.o))}</td></tr>`:''}
 ${d.paid?`<tr><td>Anticipos previos</td><td style="text-align:right">-${m(d.t.total-d.paid)}</td></tr><tr><td><b>A pagar</b></td><td style="text-align:right">${m(d.paid)}</td></tr>`:''}
 ${d.payments?Object.entries(d.payments).filter(x=>x[1]).map(([k,x])=>`<tr><td>${k[0].toUpperCase()+k.slice(1)}</td><td style="text-align:right">${m(x)}</td></tr>`).join('')+(d.change?`<tr><td>Cambio</td><td style="text-align:right">${m(d.change)}</td></tr>`:''):''}</table>
 ${d.kind==='cot'?'<hr><small>Cotización válida por 15 días. Precios sujetos a cambio sin previo aviso.</small>':''}<hr><div class="c">${esc(C.footer)}</div></div></div>
 <div class="bar" style="margin-top:12px;justify-content:center"><button class="p" onclick="window.print()">🖨 Imprimir</button><button onclick="waDoc('${id}','${kind}')">WhatsApp</button><button onclick="closeM()">Cerrar</button></div>`)}
function waDoc(id,kind){kind=kind||'cot';const d=docData(kind,id);const L=[`*${d.C.name}*`,`${d.title} ${d.folio}`,dstr(d.date)];if(d.veh)L.push(`${d.veh.type}: ${d.veh.make} ${d.veh.model} (${d.veh.plates})`);if(d.o&&kind!=='venta')L.push('Estado: '+d.o.status);L.push('');d.items.forEach(i=>L.push(`${i.qty} x ${i.name} — ${m(i.qty*i.price)}`));L.push('',`Subtotal: ${m(d.t.sub)}`);if(d.disc)L.push('Descuento: -'+m(d.disc));L.push(`IVA: ${m(d.t.iva)}`,`*TOTAL: ${m(d.t.total)}*`,'',d.C.footer,`Tel. ${d.C.phone}`);
 let ph=(d.client&&d.client.phone||'').replace(/\D/g,'');if(ph.length===10)ph='52'+ph;window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(L.join('\n')),'_blank')}
// ---- reports
function v_reportes(){const per=window._rp||'dia',now=new Date(),s=new Date(now);s.setHours(0,0,0,0);if(per==='semana')s.setDate(s.getDate()-6);if(per==='mes')s.setDate(s.getDate()-29);
 const ss=salesIn(s.toISOString(),'9'),tot=ss.reduce((a,x)=>a+x.total,0);let profit=0;const sv={},pt={};
 ss.forEach(x=>{x.items.forEach(i=>{profit+=(i.price-(i.cost||0))*i.qty;const b=i.kind==='labor'?sv:pt;b[i.name]=(b[i.name]||0)+i.price*i.qty});profit-=x.discount||0});
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);const days=per==='mes'?30:7,bars=[];for(let i=days-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const e=new Date(d);e.setDate(e.getDate()+1);bars.push([d.getDate()+'/'+(d.getMonth()+1),salesIn(d.toISOString(),e.toISOString()).reduce((a,x)=>a+x.total,0)])}
 const mx=Math.max(1,...bars.map(b=>b[1])),W=600,H=180,bw=W/bars.length;
 const chart=`<svg viewBox="0 0 ${W} ${H+20}" style="width:100%;height:auto">${bars.map((b,i)=>{const h=b[1]/mx*H;return `<rect x="${i*bw+2}" y="${H-h}" width="${bw-4}" height="${h}" rx="3" fill="var(--ac)"><title>${b[0]}: ${m(b[1])}</title></rect>${days<=7||i%5===0?`<text x="${i*bw+bw/2}" y="${H+14}" fill="#8b91a0" font-size="11" text-anchor="middle">${b[0]}</text>`:''}`}).join('')}</svg>`;
 const sc=STS.map(x=>[x,db.orders.filter(o=>o.status===x).length]),smx=Math.max(1,...sc.map(x=>x[1]));
 const stChart=`<svg viewBox="0 0 400 ${sc.length*28}" style="width:100%">${sc.map((x,i)=>`<text x="0" y="${i*28+17}" fill="#e8e9ec" font-size="12">${x[0]}</text><rect x="120" y="${i*28+4}" width="${x[1]/smx*240}" height="18" rx="3" fill="var(--ac2)"/><text x="${126+x[1]/smx*240}" y="${i*28+17}" fill="#8b91a0" font-size="12">${x[1]}</text>`).join('')}</svg>`;
 const lst=a=>a.length?`<table>${a.map(x=>`<tr><td>${esc(x[0])}</td><td class="r">${m(x[1])}</td></tr>`).join('')}</table>`:'<p class="mut">Sin datos</p>';
 return `<h2>Reportes</h2><div class="bar">${[['dia','Hoy'],['semana','7 días'],['mes','30 días']].map(([k,t])=>`<button class="${k===per?'p':''}" onclick="window._rp='${k}';render()">${t}</button>`).join('')}</div>
 <div class="grid"><div class="card kpi"><span>Ventas</span><b>${m(tot)}</b><span>${ss.length} tickets</span></div><div class="card kpi"><span>Utilidad (precio − costo)</span><b>${m(profit)}</b></div><div class="card kpi"><span>Ticket promedio</span><b>${m(ss.length?tot/ss.length:0)}</b></div></div>
 <div class="card" style="margin-top:12px"><h3>Ventas diarias (${days} días)</h3>${chart}</div>
 <div class="grid" style="margin-top:12px"><div class="card"><h3>Top servicios</h3>${lst(top(sv))}</div><div class="card"><h3>Top refacciones</h3>${lst(top(pt))}</div><div class="card"><h3>Órdenes por estado</h3>${stChart}</div></div>`}
// ---- config
async function hash(pw,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function unlock(){const pw=$('#lk').value;if(await hash(pw,db.config.pwSalt)===db.config.pwHash){unlocked=true;render()}else toast('Contraseña incorrecta')}
function v_config(){const C=db.config;if(C.pwHash&&!unlocked)return `<h2>Configuración</h2><div class="card" style="max-width:360px"><h3>🔒 Protegido</h3><label>Contraseña</label><input id="lk" type="password" onkeydown="if(event.key==='Enter')unlock()"><button class="p" style="margin-top:10px" onclick="unlock()">Desbloquear</button></div>`;
 return `<h2>Configuración</h2><div class="grid"><div class="card"><h3>Datos del taller</h3><label>Nombre</label><input id="k_name" value="${esc(C.name)}"><label>Dirección</label><input id="k_addr" value="${esc(C.address)}"><div class="row"><div><label>Teléfono</label><input id="k_phone" value="${esc(C.phone)}"></div><div><label>RFC</label><input id="k_rfc" value="${esc(C.rfc)}"></div></div><label>Pie de ticket</label><textarea id="k_foot">${esc(C.footer)}</textarea>
 <label>Logo</label><div class="row">${C.logo?`<img src="${C.logo}" style="max-width:60px;flex:0">`:''}<input type="file" accept="image/*" onchange="logoUp(this)"><button class="nf s" onclick="db.config.logo='';save();render()">Quitar</button></div>
 <label><input type="checkbox" style="width:auto" id="k_iva" ${C.iva?'checked':''}> Aplicar IVA 16% por defecto</label><label>Mecánicos (uno por línea)</label><textarea id="k_mech">${esc(C.mechanics.join('\n'))}</textarea><button class="p" style="margin-top:10px" onclick="saveCfg()">Guardar configuración</button></div>
 <div class="card"><h3>Seguridad</h3><p class="mut">${C.pwHash?'Configuración protegida con contraseña (hash SHA-256 con sal).':'Sin contraseña. Cualquiera puede modificar la configuración.'}</p><label>Nueva contraseña</label><input id="k_pw" type="password"><div class="bar" style="margin-top:10px"><button onclick="setPw()">Establecer contraseña</button>${C.pwHash?'<button class="d" onclick="db.config.pwHash=db.config.pwSalt=\'\';save();render()">Quitar</button><button onclick="unlocked=false;render()">🔒 Bloquear</button>':''}</div>
 <h3 style="margin-top:16px">Respaldo</h3><div class="bar"><button onclick="exportJ()">⬇ Exportar JSON</button><label class="btn" style="margin:0;color:var(--tx);font-size:15px">⬆ Importar JSON<input type="file" accept=".json" hidden onchange="importJ(this)"></label></div>
 <h3 style="margin-top:16px">Datos demo</h3><button class="d" onclick="clearDemo()">Borrar datos demo</button></div></div>`}
function saveCfg(){Object.assign(db.config,{name:$('#k_name').value,address:$('#k_addr').value,phone:$('#k_phone').value,rfc:$('#k_rfc').value.toUpperCase(),footer:$('#k_foot').value,iva:$('#k_iva').checked,mechanics:$('#k_mech').value.split('\n').map(s=>s.trim()).filter(Boolean)});save();render();toast('Configuración guardada')}
function logoUp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,200/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);db.config.logo=c.toDataURL('image/png');save();render()};img.src=r.result};r.readAsDataURL(f)}
async function setPw(){const pw=$('#k_pw').value;if(pw.length<4)return toast('Mínimo 4 caracteres');const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');db.config.pwSalt=salt;db.config.pwHash=await hash(pw,salt);unlocked=true;save();render();toast('Contraseña establecida')}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='ghostbiker-respaldo-'+today()+'.json';a.click()}
function importJ(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.clients||!d.config)throw 0;if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?'))return;db=d;save();unlocked=false;render();toast('Respaldo importado')}catch(e){toast('Archivo inválido')}})}
load();render();
</script></body></html>
